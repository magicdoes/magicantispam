# ============================================================
# MagicSMP Anti-Spam
# Paper 26.2
# ============================================================

# Delay before a player can send another message.
cooldown-seconds: 2.0

# How long the plugin remembers the player's previous message.
repeat-window-seconds: 20.0

# 1.0 = messages must be identical
# 0.85 = catches messages that are roughly 85% similar
similarity-threshold: 0.85

# Prevent tiny messages such as "a" and "b" being falsely
# detected as similar.
minimum-similarity-length: 4

# OP players bypass the anti-spam.
op-bypass: true

messages:
  cooldown: "&cPlease wait before sending another message."
  repeat: "&cPlease do not repeat the same or similar message."
  reloaded: "&aMagicAntiSpam configuration reloaded."

sound:
  enabled: true
  name: "ENTITY_VILLAGER_NO"
  volume: 1.0
  pitch: 1.0
